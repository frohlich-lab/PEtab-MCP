[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "petab-mcp"
dynamic = ["version"]
description = "A local MCP server for interactively editing a PEtab (v2) model/parameters and scoring against fixed data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Fabian Fröhlich" },
    { name = "Branwen Snelling" },
    { name = "Theodore de Pomereu" },
]
keywords = ["petab", "mcp", "systems-biology", "sbml", "parameter-estimation", "amici"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# The simulation stack (AMICI + pyPESTO) is a hard requirement: fitting and simulation
# run automatically on every model commit, so the server assumes they are present.
# Installing therefore needs a C++ toolchain, CMake/Ninja, and swig (see README).
dependencies = [
    # The MCP server framework. server.py builds on the STANDALONE `fastmcp` package -- the
    # maintained continuation of the FastMCP that once shipped inside the `mcp` SDK and was
    # removed there in mcp 2.0.0. `from fastmcp import FastMCP` replaces the old
    # `from mcp.server.fastmcp import FastMCP`; the tool/resource decorators, the
    # `FastMCP(name, instructions=...)` constructor, and `run(transport=...)` are unchanged.
    # 4.x, built on the mcp 2.0 SDK: the server runs on it unchanged. The floor is what the
    # harness (frohlich-lab/gemot, which installs this server into its own environment) moves
    # with: `langchain-mcp-adapters`, its tool bridge, is archived at `mcp<2`, and its successor,
    # LangChain's own `langchain.mcp`, needs fastmcp >= 4.0.11. A gemot pinned below this commit
    # resolves fastmcp 3 and mcp 1.x; one pinned at or past it has to be on mcp 2.
    # Revisit the cap when fastmcp 5 ships (4.x deprecates the bare-string `Client("server.py")`
    # for removal there; tests/test_cli.py builds its client from a StdioTransport, not a string).
    "fastmcp>=4,<5",
    # Imported directly by `server._Cancellation`, which hears a client's cancel beside a tool's
    # thread; only transitively present via fastmcp otherwise. 3.1 added `sleep_forever`.
    "anyio>=3.1",
    # Ships each start to a worker process, as pyPESTO's own MultiProcessEngine does
    # (`multistart`, `dask_engine`). No version is known to break that, so it has no floor.
    "cloudpickle",
    # 0.10.0 is the first release with PEtab-dev/libpetab-python#556 and #557, which let
    # `assignments_to_experiments` convert assignments that switch more than once (Brannmark) and
    # values that ramp between switches (Fujita), and #546, without which Raimundez's upgraded
    # problem does not import. It also has `petab1to2(validate=False)` (#534), which upgrades a v1
    # problem that does not lint (every benchmark problem is, until its agent writes the model),
    # petab1to2's own rescaling of log10 noise onto log-normal (#535), and the SciML extension
    # (`petab.v2.extensions.sciml`), which the harness's neural route stages its problems in.
    # The `pins` group below adds PEtab-dev/libpetab-python#579, which keeps per-experiment
    # constants in the condition table, where `ExperimentsToSbmlConverter` made each a piecewise
    # initial assignment with a branch per experiment; without it Froehlich_CellSystems2018 (9169
    # experiments) does not import.
    "petab>=0.10.0",
    "python-libsbml>=5.19",
    # Floored at 3.2 because `validation.frozen_parametric_stoichiometry_issues` is now the ONLY
    # guard against a symbolic reaction stoichiometry. Below
    # 3.2, reusing one symbol across several stoichiometries (`N A -> N B`) instead fails the
    # Antimony->SBML conversion on an id-uniqueness clash, raising an opaque libSBML error that
    # nothing here translates.
    "antimony>=3.2",
    "pandas>=1.5",
    "numpy>=1.23",
    "duckdb>=0.9",
    # Never imported here: pyPESTO's storage API writes the per-fit pypesto_result.hdf5
    # (fitting._write_result_hdf5 / provenance's copy-forward) and h5py is what it writes
    # through. Pinned explicitly so that path can't break on a transitive graph change.
    "h5py>=3",
    "sympy>=1.10",
    # Imported directly for the chi2 goodness-of-fit p-value (residual_tests, fitting). Only
    # transitively present via pyPESTO otherwise.
    "scipy>=1.10",
    # 1.2.0 is the first release with all five of these. AMICI-dev/AMICI#3408 makes the JAX code
    # compile for `And`/`Or`: sympy's `logical_or.reduce((a, b))` is refused by jax, and
    # libpetab#546's flat initial assignments produce an `Or` wherever two experiments set a target
    # alike, so the JAX backend (gemot's neural-ODE route trains through it) could not build such a
    # problem. #3312 gives the PEtab v2 simulator per-parameter scales, which pyPESTO's importer
    # hands it (below). Without #3309 a hierarchical PEtab v2 problem cannot be unpickled once its
    # objective has been evaluated (ICB-DCM/pyPESTO#1771) -- and every fit evaluates the objective
    # before its parallel multistart pickles the problem into the workers. #3388: a noise formula
    # that reads an assignment rule compiles (before it, `dsigmaydp.cpp` named the rule's target
    # undeclared), which every proportional noise model does once its observable reads a readout
    # rule. #3397: a trigger whose time an event sets fires at that time; the v2 import applies
    # every condition by event, and root-finding switched such a trigger straight back off, so a v2
    # stimulus applied that way never stayed on. PyPI has only an sdist, so AMICI is built from
    # source, which is why CI installs a toolchain before it.
    "amici>=1.2.0",
    # 0.8.0 is the first release with #1782: the PEtab v2 importer takes the estimation scales
    # (`PetabImporter(parameter_scales=...)`), which v2 dropped from the format; without it every
    # v2 problem is optimised linearly, with start points almost all in the top decade of a
    # log-spanning box. It has #1740, before which the v2 importer raised NotImplementedError for
    # `hierarchical=True`, so the fit inner-solves its noise sigmas and observable scalings
    # whenever the problem allows. And it has #1786, which keeps a constant term out of a
    # hierarchical scaling (`scale * h + c`, Alkan's readouts), which was scaled with it, silently.
    "pypesto[petab]>=0.8.0",
    "fides>=0.8.1",
]

[project.optional-dependencies]
# Fits on a dask cluster: `create_server(cluster=...)`, petab_mcp.dask_engine and petab_mcp.pool,
# the only importers. `distributed` below 2023.12.0 ignores a plugin's `idempotent` attribute, so
# every server's `register_plugin` re-sends the workers' plugin to each worker of the pool.
# dask-jobqueue builds `petab-mcp-pool`'s SLURM cluster; below 0.8.5 every `sbatch`/`scancel` it
# runs blocked the event loop of the scheduler the pool hosts in its process (dask/dask-jobqueue#610).
dask = ["distributed>=2023.12.0", "dask-jobqueue>=0.8.5"]
# The `statements` route: a server given `--entity-map` (and `--constraints`), which builds models
# from INDRA statements as PySB rules. Nothing else imports these, so the Antimony routes install
# without them, and without the pysb that no release lets install beside AMICI.
statements = [
    # INDRA supplies the Statement base class the mechanism vocabulary extends (`statements`),
    # Agent grounding, Preassembler deduplication, and the PySB assembler's monomer and site
    # construction (`mechanisms.assemble`). Pinned to one minor: `mechanisms` drives the
    # assembler's private monomer pass and dispatch, and `statements` registers its subclass into
    # `indra.statements.statements`, none of which is a public interface.
    # Revisit once INDRA exposes a stable policy-registration interface.
    "indra>=1.24,<1.25",
    # Never imported here: INDRA requires boto3, whose botocore caps python-dateutil below 3.
    # Offered dateutil 3.0, uv keeps it and backtracks to boto3 0.0.3, whose six 1.7.3 breaks
    # `import dateutil.tz`, and pandas with it. pip happens to backtrack dateutil instead.
    # Drop this once botocore allows dateutil 3.
    "python-dateutil<3",
    # The model language the mechanisms build, and its SBML export (`problem_sbml`). No release
    # resolves: 1.17.0 caps sympy below 1.12, which amici needs, and pysb#611, which lifts the cap,
    # is unreleased. The `pins` group below installs a master commit that has it. Revisit with the
    # next release, as `pysb>=1.18,<2`: the policies construct Rule, Expression and Observable
    # directly.
    "pysb>=1.17",
    # Never imported here: it ships the BioNetGen that pysb finds and runs to expand the rules into
    # reactions (`problem_sbml`). 0.8.7 is what the suite is measured against. BioNetGen is a Perl
    # program pysb runs as `perl BNG2.pl`, so `perl` must be on PATH or every expansion fails
    # (README, Install); pip cannot provide it.
    "bionetgen>=0.8.7",
]
# The viewer (`petab-mcp-viz`, petab_mcp.viz), the only importer; the server never imports it.
# The floors are the releases it was written and tested against (holoviews 1.23.2, panel 1.11.1,
# networkx 3.7); nothing older was tried. networkx lays out the model graph (kamada_kawai_layout,
# which runs on the scipy the core already pins).
viz = ["holoviews>=1.23", "panel>=1.11", "networkx>=3.7"]
dev = [
    # The dask, statements and viz extras, so CI runs tests/test_dask_engine.py, tests/test_pool.py
    # (which submits nothing to SLURM), the statements route and the viewer's tests rather than
    # skipping them.
    "petab-mcp[dask,statements,viz]",
    "pytest>=7", "pytest-asyncio>=0.23", "pytest-xdist>=3",
    # The MCP Python client, whose 1 MiB SSE event limit tests/test_server.py holds `get_version`
    # under (PEtab-MCP#231); only transitively present via fastmcp otherwise. 2.3 is fastmcp 4.1's
    # floor; revisit the cap when mcp 3 ships.
    "mcp>=2.3,<3",
    # The linter CI runs (`ruff check .`, config in [tool.ruff] below). Floored at 0.6 -- the
    # version the rule set was selected against. Left UNCAPPED deliberately: a new ruff CAN add
    # rules inside the E/F/W families we select, but the resulting failure is a handful of local
    # fixes, which is cheaper than an upper bound nobody remembers to raise. If a version bump
    # ever lands a rule that is wrong FOR THIS REPO, add it to `ignore` with the reason -- do not
    # cap ruff. CI installs ruff on its own (it needs no C++ toolchain), so this pin exists so a
    # developer runs the same check locally.
    "ruff>=0.6",
]

[project.scripts]
petab-mcp = "petab_mcp.cli:main"
petab-mcp-pool = "petab_mcp.pool:main"
petab-mcp-viz = "petab_mcp.viz.cli:main"

[project.urls]
Homepage = "https://github.com/frohlich-lab/PEtab-MCP"
Repository = "https://github.com/frohlich-lab/PEtab-MCP"

# Unreleased commits the dependencies above need, kept out of the published metadata because
# PyPI refuses a direct reference there: `pip install -e . --group pins` (pip >= 25.1).
[dependency-groups]
pins = [
    "petab @ git+https://github.com/PEtab-dev/libpetab-python.git@08a13908b060dd605df09f3a58c65ac01464520b",
    "pysb @ git+https://github.com/pysb/pysb.git@9fc6bcb118683ad851e0a4d5604abe646f77cae3",
]

# The one place the version is set: `__version__` in the package.
[tool.hatch.version]
path = "src/petab_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/petab_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/petab_mcp", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# NO `-n` here, deliberately. Parallelism is requested by the CALLER (`.github/workflows/ci.yml`
# passes `-n 2` for the 2-core runner) rather than baked into every invocation, because in addopts
# it cost more than it bought locally: it made pytest-xdist a HARD dependency (bare `pytest` exits
# 4 on the unrecognised argument before collecting anything), it breaks `--pdb`, and it made even
# `pytest tests/test_model_edits.py` spawn two workers.
#
# That last one is the expensive part, and the reason the scaling is poor in general: 8 workers cut
# the full suite from 662s to 306s, only 2.2x. `conftest.amici_build_root` is session-scoped, so
# ONE AMICI build root is shared and the toy model compiles once (~60-90s) -- but under xdist each
# worker is its own process with its own root, so that compile is paid PER WORKER and eats most of
# what the parallelism buys. Raising the worker count mostly buys more compiles; a single-file
# debug run paid it twice for no parallelism at all. Making it scale means sharing one root across
# workers behind a file lock, which is a real change, not a flag.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Deliberately NARROW. This linter was configured onto a ~53k-line codebase that had never run
# one, so the rule set is what the code ALREADY satisfies (plus the ~20 real defects fixed in the
# same change) rather than what a greenfield project would pick. Widening is a separate change per
# family, each with its own diff -- see docs/STYLE_GUIDE.md for the ones deliberately left out
# (`I`, `UP`, `BLE`).
select = ["E", "F", "W"]
ignore = [
    # Line length is a ~100-col TARGET, not a gate. ~350 lines in `src/` exceed it and nearly all
    # of them are the rationale comments that carry this repo's institutional memory; reflowing
    # them would churn `git blame` across every module to buy nothing. Write to 100 anyway.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# `petab_mcp/__init__.py` sequences its imports around a package-level side effect
# (`antimony_guard.install()` must run before `.session` is imported), which is what E402 flags.
"__init__.py" = ["E402"]
