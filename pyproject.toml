[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "petab-mcp"
version = "0.1.0"
description = "A local MCP server for interactively editing a PEtab (v1) model/parameters and scoring against fixed data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Fabian Fröhlich" }]
keywords = ["petab", "mcp", "systems-biology", "sbml", "parameter-estimation", "amici"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# The simulation stack (AMICI + pyPESTO) is a hard requirement: fitting and simulation
# run automatically on every model commit, so the server assumes they are present.
# Installing therefore needs a C++ toolchain, CMake/Ninja, and swig (see README).
dependencies = [
    # The MCP server framework. server.py builds on the STANDALONE `fastmcp` package -- the
    # maintained continuation of the FastMCP that once shipped inside the `mcp` SDK and was
    # removed there in mcp 2.0.0. `from fastmcp import FastMCP` replaces the old
    # `from mcp.server.fastmcp import FastMCP`; the tool/resource decorators, the
    # `FastMCP(name, instructions=...)` constructor, and `run(transport=...)` are unchanged.
    # fastmcp 3.x pulls a compatible `mcp` (1.x) in transitively, which is what the agent
    # harness's MCP *client* code imports (frohlich-lab/petab_mcp, which installs this server
    # into the same environment) -- so no separate `mcp` pin is needed there.
    # Held below 4 deliberately: fastmcp 4.x pulls in the mcp 2.0 SDK, and that harness's AGENT
    # STACK cannot run on mcp 2.0 yet -- `langchain-mcp-adapters` (the load_mcp_tools bridge the
    # deepagents driver needs) hard-imports the `mcp.server.fastmcp` module that mcp 2.0 deleted,
    # in every released version (through 0.3.1), so merely importing it crashes under mcp 2.0.
    # mcp 2.0 also reworks the client API the harness uses directly (streamablehttp_client ->
    # streamable_http_client with a new signature; CallToolResult/Tool fields went snake_case).
    # Revisit once langchain-mcp-adapters ships mcp 2.0 support.
    "fastmcp>=3,<4",
    # 0.9 is the first release whose v2 problem carries the SciML extension natively
    # (`petab.v2.extensions.sciml`); the harness's neural route stages its problems in that form
    # and reads them back through `petab.v2.Problem.from_yaml`, which older releases refuse.
    "petab>=0.9",
    "python-libsbml>=5.19",
    # Floored at 3.2 because `validation.frozen_parametric_stoichiometry_issues` is now the ONLY
    # guard against a symbolic reaction stoichiometry (issue frohlich-lab/petab_mcp#89). Below
    # 3.2, reusing one symbol across several stoichiometries (`N A -> N B`) instead fails the
    # Antimony->SBML conversion on an id-uniqueness clash, raising an opaque libSBML error that
    # nothing here translates.
    "antimony>=3.2",
    "pandas>=1.5",
    "numpy>=1.23",
    "duckdb>=0.9",
    # Never imported here: pyPESTO's storage API writes the per-fit pypesto_result.hdf5
    # (fitting._write_result_hdf5 / provenance's copy-forward) and h5py is what it writes
    # through. Pinned explicitly so that path can't break on a transitive graph change.
    "h5py>=3",
    "sympy>=1.10",
    # Imported directly for the chi2 goodness-of-fit p-value (residual_tests, fitting). Only
    # transitively present via pyPESTO otherwise.
    "scipy>=1.10",
    # 1.x, not 0.30: the package was reorganised at 1.0 and every import here uses the new layout
    # (`amici.importers.petab.v1`, `amici.importers.sbml`, `amici.sim.sundials.petab.v1`), none
    # of which exists in 0.x -- the old floor admitted versions that fail at import. 1.1.0 is what
    # the cluster env runs and the suite is measured against.
    "amici>=1.1",
    "pypesto[petab]>=0.5",
    "fides>=0.7",
    # INDRA supplies the Statement base class the mechanism vocabulary extends (`statements`),
    # Agent grounding, Preassembler deduplication, and the PySB assembler's monomer and site
    # construction (`mechanisms.assemble`). Pinned to one minor: `mechanisms` drives the
    # assembler's private monomer pass and dispatch, and `statements` registers its subclass into
    # `indra.statements.statements`, none of which is a public interface.
    # Revisit once INDRA exposes a stable policy-registration interface.
    "indra>=1.24,<1.25",
    # The model language the mechanisms build, and its SBML export (`problem_sbml`). A commit on
    # master, not a release: 1.17.0 caps sympy below 1.12, which amici needs, and the commit lifting
    # the cap (pysb#611) is unreleased. Revisit with the next release, as `pysb>=1.18,<2`: the
    # policies construct Rule, Expression and Observable directly.
    "pysb @ git+https://github.com/pysb/pysb.git@9fc6bcb118683ad851e0a4d5604abe646f77cae3",
    # Never imported here: it ships the BioNetGen that pysb finds and runs to expand the rules into
    # reactions (`problem_sbml`). 0.8.7 is what the suite is measured against.
    "bionetgen>=0.8.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7", "pytest-asyncio>=0.23", "pytest-xdist>=3",
    # The linter CI runs (`ruff check .`, config in [tool.ruff] below). Floored at 0.6 -- the
    # version the rule set was selected against. Left UNCAPPED deliberately: a new ruff CAN add
    # rules inside the E/F/W families we select, but the resulting failure is a handful of local
    # fixes, which is cheaper than an upper bound nobody remembers to raise. If a version bump
    # ever lands a rule that is wrong FOR THIS REPO, add it to `ignore` with the reason -- do not
    # cap ruff. CI installs ruff on its own (it needs no C++ toolchain), so this pin exists so a
    # developer runs the same check locally.
    "ruff>=0.6",
]

[project.scripts]
petab-mcp = "petab_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/frohlich-lab/PEtab-MCP"
Repository = "https://github.com/frohlich-lab/PEtab-MCP"

[tool.hatch.metadata]
# The pysb pin above is a git commit, which hatchling refuses without this.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/petab_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/petab_mcp", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# NO `-n` here, deliberately. Parallelism is requested by the CALLER (`.github/workflows/ci.yml`
# passes `-n 2` for the 2-core runner) rather than baked into every invocation, because in addopts
# it cost more than it bought locally: it made pytest-xdist a HARD dependency (bare `pytest` exits
# 4 on the unrecognised argument before collecting anything), it breaks `--pdb`, and it made even
# `pytest tests/test_model_edits.py` spawn two workers.
#
# That last one is the expensive part, and the reason the scaling is poor in general: 8 workers cut
# the full suite from 662s to 306s, only 2.2x. `conftest.amici_build_root` is session-scoped, so
# ONE AMICI build root is shared and the toy model compiles once (~60-90s) -- but under xdist each
# worker is its own process with its own root, so that compile is paid PER WORKER and eats most of
# what the parallelism buys. Raising the worker count mostly buys more compiles; a single-file
# debug run paid it twice for no parallelism at all. Making it scale means sharing one root across
# workers behind a file lock, which is a real change, not a flag.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Deliberately NARROW. This linter was configured onto a ~53k-line codebase that had never run
# one, so the rule set is what the code ALREADY satisfies (plus the ~20 real defects fixed in the
# same change) rather than what a greenfield project would pick. Widening is a separate change per
# family, each with its own diff -- see docs/STYLE_GUIDE.md for the ones deliberately left out
# (`I`, `UP`, `BLE`).
select = ["E", "F", "W"]
ignore = [
    # Line length is a ~100-col TARGET, not a gate. ~350 lines in `src/` exceed it and nearly all
    # of them are the rationale comments that carry this repo's institutional memory; reflowing
    # them would churn `git blame` across every module to buy nothing. Write to 100 anyway.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# `petab_mcp/__init__.py` sequences its imports around a package-level side effect
# (`antimony_guard.install()` must run before `.session` is imported), which is what E402 flags.
"__init__.py" = ["E402"]
