name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:        # run required checks on the merge-queue ref (else the queue stalls)
  workflow_dispatch:  # by hand: everything, as the weekly run
  # Weekly, Mondays 03:00 UTC: everything, the regulator corpus on every Python too, whatever
  # changed. A failure fails the run, red on the Actions page.
  schedule:
    - cron: "0 3 * * 1"

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR). By event too, so a push to
# main does not cancel the weekly run on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result even if one fails.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Not setup-python's pip cache, which falls back to any older cache of the same Python: pip
      # keys the AMICI wheel it builds on the URL alone, so this prefix names the toolchain below.
      # Change "hdf5" when that toolchain changes.
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-hdf5-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-hdf5-${{ runner.os }}-py${{ matrix.python-version }}-

      # AMICI generates and compiles C++ for every model, and is itself built
      # from source here (PyPI has only its sdist; its build pulls BLAS from
      # the scipy-openblas64 wheel). A C/C++ compiler and CMake ship on
      # ubuntu-latest; the Ninja generator AMICI drives CMake with does not, so
      # install it.
      #
      # HDF5 too: AMICI builds with it only if it finds the headers, and needs it
      # to pickle a solver, i.e. to send a fit start to a worker.
      #
      # Deliberately NOT installing the apt `swig`: AMICI is built against the
      # pip `swig`, and a mismatched system SWIG makes compiled models raise
      # "'SwigPyObject' object has no attribute 'module'". The matching SWIG is
      # the pip `swig` package (installed and pinned below).
      - name: Install build toolchain (Ninja, HDF5)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake build-essential
          sudo apt-get install -y libhdf5-dev  # with its recommends, as AMICI's own CI does

      # AMICI's source build compiles serially unless told otherwise; the pip
      # cache keeps the wheel it builds.
      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          AMICI_PARALLEL_COMPILE=$(nproc) python -m pip install -e '.[dev]'

      # `swig` is an (unpinned) AMICI dependency, so `.[dev]` already pulls it;
      # install it explicitly too so CI never silently relies on the transitive
      # graph. Its version tracks the SWIG AMICI's own build used, which is
      # what compiled models must match.
      - name: Install the SWIG that matches the AMICI wheel
        run: python -m pip install swig

      # Point AMICI's per-model CMake build at that pip `swig`, overriding any
      # SWIG pre-installed on the runner. AMICI honours $SWIG / $SWIG_LIB in the
      # generated model's CMakeLists. Both are resolved from the installed
      # package (its bundled data/bin/swig reports a stale -swiglib, so SWIG_LIB
      # must be set explicitly). No system-SWIG fallback: the job fails loudly if
      # the package binary is missing rather than compiling against a mismatched
      # SWIG.
      - name: Pin SWIG to the AMICI-matching build
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import pathlib, sys, swig
          data = pathlib.Path(swig.__file__).resolve().parent / "data"
          swig_bin = data / "bin" / "swig"
          lib_dirs = sorted(p for p in (data / "share" / "swig").iterdir() if p.is_dir())
          if not swig_bin.is_file() or not lib_dirs:
              sys.exit(f"pip `swig` package is missing its bundled binary/library: {swig_bin}, {lib_dirs}")
          print(f"SWIG={swig_bin}")
          print(f"SWIG_LIB={lib_dirs[-1]}")
          PY

      - name: Run tests
        # -n 2 lives HERE, not in pyproject's addopts, so it applies to CI (a 2-core runner)
        # without taxing every local invocation: in addopts it made pytest-xdist a hard
        # dependency (bare pytest exits 4 on the unrecognised argument), broke --pdb, and made
        # even a single-file debug run spawn two workers -- each with its own session-scoped
        # amici_build_root, so the ~60-90s toy-model compile was paid twice for no parallelism.
        # The regulator corpus runs in its own job, below, only where it can change; a local
        # `pytest` still runs it.
        run: python -m pytest -v -n 2 --ignore tests/test_regulator_corpus.py

  # Whether a change can move a verdict of the regulator corpus (tests/test_regulator_corpus.py):
  # the files below, diffed against the merge base. A job-level filter, not the workflow's own
  # `paths:`, so the required checks above still run on every change and the corpus job shows as
  # skipped, not missing. The weekly and by-hand runs have nothing to diff against: they run it.
  #
  # THE LIST MUST FOLLOW THE CODE: it is what the regulator check imports and decides with
  # (`regulation.check`/`record` and what they call): regulation.py (the net rate and its sign),
  # mechanisms.py (assembly, bindings, the sign prover), schemes.py (scheme rules),
  # statements.py (what each statement type consumes and makes), notation.py (the rows and the
  # refusals' advice), problem_sbml.py (the expansion J is read off); pyproject.toml, whose pins
  # (sympy, PySB, INDRA) decide what the prover shows; the corpus, its test and this file. A
  # module the check comes to import joins the list.
  changes:
    name: regulator corpus changes
    runs-on: ubuntu-latest
    outputs:
      corpus: ${{ steps.diff.outputs.corpus }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff against the merge base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            merge_group) base="$QUEUE_BASE" ;;
            push) base="$BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "corpus=true" >> "$GITHUB_OUTPUT"  # nothing to diff against: run it
            exit 0
          fi
          changed=$(git diff --name-only "$(git merge-base "$base" HEAD)" HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/petab_mcp/(regulation|mechanisms|schemes|statements|notation|problem_sbml)\.py|pyproject\.toml|tests/test_regulator_corpus\.py|tests/data/regulator_corpus/.*|\.github/workflows/ci\.yml)$'; then
            echo "corpus=true" >> "$GITHUB_OUTPUT"
          else
            echo "corpus=false" >> "$GITHUB_OUTPUT"
          fi

  # Not a required check: skipped, it blocks nothing. On a change, one Python: a verdict is
  # sympy's and BioNetGen's, and the test job runs the regulation tests on both. The weekly and
  # by-hand runs take the test job's matrix.
  corpus:
    name: regulator corpus (py${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.corpus == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["3.12", "3.13"]' || '["3.12"]') }}
    steps:
      # The test job's setup, as there (see its comments).
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-hdf5-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-hdf5-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install build toolchain (Ninja, HDF5)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake build-essential
          sudo apt-get install -y libhdf5-dev

      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          AMICI_PARALLEL_COMPILE=$(nproc) python -m pip install -e '.[dev]'

      - name: Run the regulator corpus
        run: python -m pytest -v -n 2 tests/test_regulator_corpus.py

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Deliberately NOT `pip install -e '.[dev]'`. The `test` job above spends minutes on the
      # AMICI/C++ toolchain (compiler, CMake, Ninja, the pinned pip SWIG) because it has to
      # COMPILE models; a linter parses Python and needs none of it. Installing ruff alone keeps
      # this job at a few seconds, so a style slip is reported long before the test matrix
      # finishes. The floor matches the `dev` extra's `ruff>=0.6` -- the version [tool.ruff]'s
      # rule set was selected against -- so a local `ruff check .` and this job agree.
      - name: Install ruff
        run: python -m pip install --upgrade 'ruff>=0.6'

      # Config (rule set, ignores, per-file exemptions, and the reason for each) is in
      # pyproject.toml's [tool.ruff]; the rationale for what is deliberately NOT selected is in
      # docs/STYLE_GUIDE.md.
      - name: Run ruff
        run: ruff check --output-format=github .
